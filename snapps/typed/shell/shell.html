<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRNet typed client</title><link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script></head>
<body>
<header id="core-bar"><strong>SRNet</strong> <span class="muted">typed client core</span>
  <nav id="tabs"></nav>
  <button id="modtoggle">Show host-hidden</button>
  <span id="status" class="muted"></span></header>
<section id="upload" hidden>Share a file: <input type="file" id="file"> <input id="note" placeholder="note (optional)" maxlength="500">
  <select id="mode"><option value="gated" selected>Encrypted: only me and people I choose</option><option value="link">Encrypted: anyone with the link</option><option value="plain">Not encrypted: public and indexable</option></select>
  <input id="to" placeholder="share with (keys, comma-separated)" size="30"> <button id="send-file">Encrypt, upload &amp; draft</button>
  <span class="muted">· Open a link: <input id="openlink" size="30" placeholder="paste a file link"> <button id="openlink-go">Open</button></span></section>
<main><iframe id="tpl" sandbox="allow-scripts" referrerpolicy="no-referrer" title="template"></iframe></main>
<div id="sheet" hidden><div class="card"><h3 id="sheet-title"></h3><div class="muted" id="sheet-sub"></div>
  <pre id="sheet-body"></pre><label id="sheet-pwl" hidden>Wallet passphrase <input id="sheet-pw" type="password" autocomplete="off"></label><div id="sheet-buttons"></div></div></div>
<pre id="report" hidden></pre>
<footer class="muted">The core verifies every record. Templates run sandboxed with no network and never see your keys. Only the core signs, after you confirm.</footer>
</body></html>
